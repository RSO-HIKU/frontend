name: Frontend Web Deploy (prod)

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Export web build (dist/)
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          npm run web:export
          test -d dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    env:
      STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to Azure Storage Static Website ($web)
        run: |
          az storage blob delete-batch --account-name "$STORAGE_ACCOUNT_NAME" --source '$web' || true
          az storage blob upload-batch --account-name "$STORAGE_ACCOUNT_NAME" --destination '$web' --source dist --overwrite
